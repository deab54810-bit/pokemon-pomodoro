<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(#8fd3ff,#c8f0a8);min-height:100vh;color:#222}
header{background:#e3350d;color:#fff;padding:12px;text-align:center;border-bottom:6px solid #222;position:relative}
header h1{margin:0;font-size:1.6rem;text-shadow:2px 2px #222}
nav{display:flex;justify-content:center;gap:8px;margin:12px}
nav button,.btn{border:3px solid #222;border-radius:12px;padding:10px 18px;font-size:1rem;font-weight:bold;cursor:pointer;background:#fff;box-shadow:0 4px #222;transition:.1s}
nav button.active{background:#ffcb05}.btn:active,nav button:active{transform:translateY(3px);box-shadow:0 1px #222}
.btn.primary{background:#e3350d;color:#fff;font-size:1.3rem;padding:14px 30px}.btn:disabled{opacity:.5;cursor:default}
main{max-width:900px;margin:auto;padding:0 12px 40px}
.card{background:#fff;border:4px solid #222;border-radius:20px;padding:20px;box-shadow:0 6px #222;text-align:center}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.presets button.sel{background:#ffcb05}
input[type=number]{width:90px;font-size:1.2rem;padding:8px;border:3px solid #222;border-radius:10px;text-align:center}
#time{font-size:clamp(3rem,15vw,6rem);font-weight:900;letter-spacing:4px;margin:10px 0;font-variant-numeric:tabular-nums}
.scene{height:220px;position:relative;overflow:hidden;border-radius:16px;border:3px solid #222;isolation:isolate;container-type:size;background:#7bd25a url(img/bg-900.webp) center 60%/cover no-repeat;--int:0}
@media (min-width:700px){.scene{background-image:url(img/bg-1600.webp)}}
.scene::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(255,255,230,.35),transparent 70%);pointer-events:none}
.scene .glow{position:absolute;left:50%;bottom:-5%;width:min(90%,520px);aspect-ratio:2/1;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 80%,rgba(255,250,170,.95),rgba(255,220,80,.4) 40%,transparent 70%);opacity:0;transition:opacity .6s;pointer-events:none}
.scene.final .glow{opacity:1;animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.bush{position:absolute;left:50%;bottom:1%;width:min(88cqw,104cqh);aspect-ratio:1076/800;transform:translateX(-50%);will-change:transform}
.bush::after{content:"";position:absolute;left:18%;right:14%;bottom:7%;height:7%;background:radial-gradient(closest-side,rgba(0,40,0,.35),transparent);z-index:-1}
.bush img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none;will-change:transform;
 transform-origin:var(--ox) var(--oy);--a:1}
.bush .bl{--ox:22%;--oy:60%;--a:1.1}.bush .br{--ox:62%;--oy:60%;--a:.9}.bush .md{--ox:28%;--oy:95%;--a:.8}
.bush .fo{--ox:50%;--oy:70%;--a:1}.bush .rk{--ox:55%;--oy:98%}.bush .fr{--ox:50%;--oy:99%;--a:1.4}.bush .fy{--ox:28%;--oy:96%;--a:1}
.shaking .bl{animation:sway 3.4s ease-in-out infinite}
.shaking .br{animation:sway 3s ease-in-out -1.1s infinite}
.shaking .md{animation:sway 2.6s ease-in-out -.6s infinite}
.shaking .fr{animation:sway 2.1s ease-in-out -1.5s infinite}
.shaking .fo{animation:bob 2.4s ease-in-out -.4s infinite}
.shaking .fy{animation:bob 1.9s ease-in-out -1s infinite}
@keyframes sway{0%,100%{transform:rotate(calc(-1deg*var(--a))) skewX(calc(.8deg*var(--a)))}50%{transform:rotate(calc(1deg*var(--a))) skewX(calc(-.8deg*var(--a)))}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-1.2%) rotate(1.5deg)}}
.shaking.burst .bl{animation:rustle .16s ease-in-out infinite}
.shaking.burst .br{animation:rustle .13s ease-in-out -.06s infinite}
.shaking.burst .md{animation:rustle .12s ease-in-out -.03s infinite}
.shaking.burst .fr{animation:rustle .1s ease-in-out -.05s infinite}
.shaking.burst .fo{animation:rustleF .15s ease-in-out infinite}
.shaking.burst .fy{animation:rustleF .12s ease-in-out -.04s infinite}
.shaking.burst .rk{animation:jolt .2s ease-in-out infinite}
@keyframes rustle{0%,100%{transform:rotate(calc((-2deg - var(--int)*3.5deg)*var(--a))) skewX(calc((2deg + var(--int)*4deg)*var(--a)))}50%{transform:rotate(calc((2deg + var(--int)*3.5deg)*var(--a))) skewX(calc((-2deg - var(--int)*4deg)*var(--a)))}}
@keyframes rustleF{0%,100%{transform:translate(-.6%,0) rotate(calc(-3deg - var(--int)*4deg))}50%{transform:translate(.6%,-1.5%) rotate(calc(3deg + var(--int)*4deg))}}
@keyframes jolt{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(-.3% - var(--int)*.4%))}}
.final .bush{filter:drop-shadow(0 0 10px rgba(255,240,120,.9))}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.leaf{position:absolute;width:18px;height:9px;box-shadow:0 0 0 1px rgba(20,70,20,.5);border-radius:0 100% 0 100%;background:linear-gradient(135deg,#9be15d,#2e8b2e);will-change:transform,opacity}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(#fff,#fff7a0 40%,transparent 70%);will-change:transform,opacity}
.hint{position:absolute;left:50%;bottom:58%;font:900 2.4rem/1 sans-serif;color:#ffde00;-webkit-text-stroke:2px #222;text-shadow:0 3px 0 #222;opacity:0;pointer-events:none}
.ghost{position:absolute;left:50%;bottom:20%;width:70px;height:60px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 40%,rgba(20,40,20,.55),transparent 70%);border-radius:50% 50% 40% 40%;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.scene .bush img,.scene.final .glow{animation:none!important}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#encounter{display:none}#encounter img{width:160px;image-rendering:pixelated;animation:pop .5s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.tag{display:inline-block;padding:2px 10px;border-radius:10px;color:#fff;font-size:.85rem;font-weight:bold}
.common{background:#78c850}.uncommon{background:#6890f0}.rare{background:#a040a0}.legendary{background:#f8b800;color:#222}
.superlegendary{background:linear-gradient(90deg,#ff4d4d,#ffb84d,#fff04d,#4dff88,#4dc3ff,#b84dff);color:#222;text-shadow:0 0 3px #fff;box-shadow:0 0 8px #ffd700;animation:glow 1.5s infinite alternate}
@keyframes glow{to{box-shadow:0 0 16px #ff4dff}}
.mon.sl{border-color:#d4a000;background:linear-gradient(#fffbe0,#ffe9fb)}
.ball{width:50px;height:50px;border-radius:50%;border:3px solid #222;background:linear-gradient(#e3350d 45%,#222 45% 55%,#fff 55%);position:relative;margin:auto;display:none}
.ball::after{content:"";position:absolute;width:14px;height:14px;background:#fff;border:3px solid #222;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.throw{display:block;animation:throw .8s ease-out forwards}.wobble{animation:wob .6s 3}
@keyframes throw{from{transform:translateY(150px) scale(1.6) rotate(0)}to{transform:translateY(0) scale(1) rotate(720deg)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-25deg)}75%{transform:rotate(25deg)}}
#result{font-size:1.4rem;font-weight:bold;min-height:2em;margin:10px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.mon{background:#fff;border:3px solid #222;border-radius:12px;padding:6px;text-align:center;font-size:.85rem}
.mon img{width:80px;height:80px;image-rendering:pixelated}.mon.no img{filter:brightness(0);opacity:.35}
.mon .q{color:#999}.prog{height:20px;border:3px solid #222;border-radius:10px;overflow:hidden;background:#eee}.prog div{height:100%;background:#e3350d}
.btn{white-space:nowrap}.ball.master{background:linear-gradient(#7b2fbf 45%,#222 45% 55%,#fff 55%)}
.ball.master::before{content:"M";position:absolute;top:2px;left:50%;transform:translateX(-50%);color:#fff;font-weight:900;font-size:12px;z-index:1}
.mb{display:inline-block;margin:8px;padding:8px 16px;border:3px solid #222;border-radius:14px;background:linear-gradient(90deg,#e6ccff,#ffd6f0);color:#5a1e99;font-weight:900;font-size:1.2rem;animation:glow 1.2s infinite alternate}
.mb.hidden{display:none}
.hidden{display:none}.note{font-size:.85rem;color:#666}
.histwrap{max-height:400px;overflow:auto;border:3px solid #222;border-radius:12px}.hist{width:100%;border-collapse:collapse;font-size:.9rem}
.hist th{background:#ffcb05;position:sticky;top:0}.hist td,.hist th{padding:6px;border-bottom:1px solid #ddd}.hist img.hi{width:36px;height:36px;vertical-align:middle;object-fit:contain}
.mon img,#encounter img{object-fit:contain;image-rendering:auto}

 </div>
 </div>
</section>

</section>

// ===== 捕獲率公式 =====
// 時長基礎：20分=40%，60分=90%，線性，夾在 [20%,95%]；再乘稀有度係數
function catchRate(minutes,rarity){const base=Math.min(0.95,Math.max(0.2,0.4+(minutes-20)*(0.5/40)));const old=Math.min(0.95,Math.max(0.10,base*RARITY[rarity].mod));return 0.5+(old-0.10)*0.45/0.85}
const MASTER_BALL_CHANCE=0.005;
// 出現機率：只看稀有度（普通40% 少見35% 稀有15% 傳說7% 超級傳說3%），同稀有度內每隻機率相同
function pickPokemon(){const tiers=Object.keys(RARITY).filter(t=>DEX.some(p=>p.rarity===t));const tot=tiers.reduce((a,t)=>a+RARITY[t].weight,0);let x=Math.random()*tot,tier=tiers[tiers.length-1];for(const t of tiers){x-=RARITY[t].weight;if(x<0){tier=t;break}}const pool=DEX.filter(p=>p.rarity===tier);return pool[Math.floor(Math.random()*pool.length)]}

const KEY="pokePomodoroDex";

// 存檔格式 v2：{version, caught:{id:次數}, history:[{t,id,min,ok}]}；自動相容舊版（純次數物件）
function normalize(d){if(!d||typeof d!=="object")return{version:2,caught:{},history:[]};if(!d.caught){return{version:2,caught:Object.fromEntries(Object.entries(d).filter(([k,v])=>/^\d+$/.test(k)&&v>0)),history:[]}}return{version:2,caught:d.caught||{},history:Array.isArray(d.history)?d.history:[]}}
function loadAll(){try{return normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){return normalize(null)}}
function saveAll(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){alert("存檔失敗："+e.message)}}
const load=()=>loadAll().caught;
function record(p,min,ok,master){const d=loadAll();if(ok)d.caught[p.id]=(d.caught[p.id]||0)+1;d.history.unshift(Object.assign({t:Date.now(),id:p.id,min,ok},master?{mb:true}:{}));saveAll(d)}

function particles(n){if(RM)return;const fx=$("fx"),W=fx.clientWidth,H=fx.clientHeight;for(let i=0;i<n;i++){const leaf=Math.random()<.7,e=document.createElement("div");e.className=leaf?"leaf":"spark";

$("pause").onclick=()=>{if(!paused){clearInterval(timer);remain=Math.max(0,Math.ceil((endAt-Date.now())/1000));paused=true;$("pause").textContent="繼續";sceneOn(false);lockOff()}else{endAt=Date.now()+remain*1000;paused=false;$("pause").textContent="暫停";sceneOn(true);run()}saveSess()};
$("cancel").onclick=()=>{if(!confirm("確定要放棄嗎？這次不會遇到寶可夢喔！"))return;setJ(SKEY,null);stop();$("time").textContent=fmt(minutes*60)};
function stop(){clearInterval(timer);paused=false;$("pause").textContent="暫停";setRunning(false);document.title="寶可夢番茄鐘";lockOff()}
function finish(){stop();if(!getJ(SKEY))return;setJ(SKEY,null);
 const p=pickPokemon();const enc={id:p.id,min:sessionMin,rate:catchRate(sessionMin,p.rarity),master:Math.random()<MASTER_BALL_CHANCE};setJ(EKEY,enc);chime();notify();showEncounter(enc)}
function showEncounter(enc){const p=DEX.find(q=>q.id===enc.id);if(!p){setJ(EKEY,null);return}current=Object.assign({},p,{rate:enc.master?1:enc.rate,master:!!enc.master});sessionMin=enc.min;
 $("encName").innerHTML=`野生的 ${current.name} 出現了！ <span class="tag ${current.rarity}">${RARITY[current.rarity].name}</span>`;
 $("encImg").onerror=function(){this.onerror=null;this.src=SPRITE(current.id)};$("encImg").src=current.img;$("encImg").style.display="";$("ball").className="ball"+(current.master?" master":"");$("encRate").textContent=Math.round(current.rate*100)+"%";$("mbBadge").classList.toggle("hidden",!current.master);$("throw").textContent=current.master?"丟出大師球！":"丟出精靈球！";
 $("result").textContent="";$("throw").classList.remove("hidden");$("again").classList.add("hidden");$("encounter").style.display="block";document.title="野生寶可夢出現了！"}
$("throw").onclick=()=>{if(!getJ(EKEY))return;$("throw").classList.add("hidden");$("encImg").style.display="none";const b=$("ball");b.className="ball throw"+(current.master?" master":"");
 // 結果在丟球當下就決定並存檔，動畫中重新整理也無法重抽
 const ok=current.master||Math.random()<current.rate;record(current,sessionMin,ok,current.master);setJ(EKEY,null);
 setTimeout(()=>{b.className="ball throw wobble"+(current.master?" master":"")},800);
 setTimeout(()=>{if(ok){$("result").textContent=`🎉 ${current.master?"大師球命中！":""}抓到了！${current.name} 已登錄圖鑑！`;chime(true)}else{b.className="ball";$("encImg").style.display="";$("result").textContent=`💨 ${current.name} 逃走了…下次加油！`}$("again").classList.remove("hidden");renderDex()},2700)};
$("again").onclick=()=>{$("encounter").style.display="none";$("time").textContent=fmt(minutes*60)};
function restore(){const enc=getJ(EKEY);if(enc){if($("encounter").style.display!=="block"||!current||current.id!==enc.id)showEncounter(enc);return}
 const s=getJ(SKEY);if(!s){return}sessionMin=s.min;
 if(s.paused){clearInterval(timer);paused=true;remain=Math.round(s.remainMs/1000);endAt=s.endAt;setRunning(true);$("pause").textContent="繼續";$("time").textContent=fmt(remain);document.title=`${fmt(remain)} ⏸ 暫停中`;return}
 paused=false;endAt=s.endAt;$("encounter").style.display="none";setRunning(true);run()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")restore()});
addEventListener("focus",restore);addEventListener("pageshow",restore);
addEventListener("storage",e=>{if(e.key===SKEY||e.key===EKEY){if(!getJ(SKEY)&&!getJ(EKEY)&&!paused){stop();$("time").textContent=fmt(minutes*60)}restore()}});
let ac;function initAudio(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function chime(win){initAudio();if(!ac)return;const notes=win?[523,659,784,1047]:[784,659,784,988];notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime+i*.15);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.15+.3);o.connect(g).connect(ac.destination);o.start(ac.currentTime+i*.15);o.stop(ac.currentTime+i*.15+.3)})}
function renderDex(){const d=load();let n=0;$("dex").innerHTML=DEX.map(p=>{const c=d[p.id];if(c)n++;return `<div class="mon ${c?"":"no"} ${p.rarity==="superlegendary"?"sl":""}"><div>#${String(p.id).padStart(3,"0")}</div>${imgTag(p)}<div>${c?p.name:'<span class="q">？？？</span>'}</div>${c?`<div>捕獲 ×${c}</div>`:""}</div>`}).join("");$("progTxt").textContent=`${n}/${DEX.length}`;$("progBar").style.width=(n/DEX.length*100)+"%";renderHist()}
function renderHist(){const h=loadAll().history;$("histSum").textContent=`共 ${h.length} 次遭遇，成功 ${h.filter(x=>x.ok).length} 次，累積專心 ${h.reduce((a,x)=>a+x.min,0)} 分鐘`;
 $("hist").innerHTML=h.length?h.map(x=>{const p=DEX.find(q=>q.id===x.id)||{id:x.id,name:"#"+x.id,img:SPRITE(x.id)};const dt=new Date(x.t);return `<tr><td>${dt.toLocaleDateString("zh-TW")} ${dt.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}</td><td>${imgTag(p,"hi")}${p.name}</td><td>${x.min} 分</td><td>${x.ok?"✅ 捕獲":"💨 逃走"}${x.mb?" 🟣大師球":""}</td></tr>`}).join(""):'<tr><td colspan="4">還沒有紀錄，開始專心吧！</td></tr>'}
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(loadAll(),null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`寶可夢番茄鐘存檔-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove()};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const inc=normalize(JSON.parse(r.result));const d=loadAll();const seen=new Set(d.history.map(x=>x.t+"_"+x.id));const newH=inc.history.filter(x=>!seen.has(x.t+"_"+x.id));
 if(newH.length||!inc.history.length){for(const[k,v]of Object.entries(inc.caught)){const add=inc.history.length?newH.filter(x=>x.ok&&String(x.id)===k).length:v;if(add>0)d.caught[k]=(d.caught[k]||0)+add}}
 d.history=d.history.concat(newH).sort((a,b)=>b.t-a.t);saveAll(d);renderDex();alert(`匯入完成！新增 ${newH.length} 筆紀錄`)}catch(err){alert("匯入失敗：檔案格式不正確")}e.target.value=""};r.readAsText(f)};
$("tabT").onclick=()=>{$("viewT").classList.remove("hidden");$("viewD").classList.add("hidden");$("tabT").classList.add("active");$("tabD").classList.remove("active")};
$("tabD").onclick=()=>{renderDex();$("viewD").classList.remove("hidden");$("viewT").classList.add("hidden");$("tabD").classList.add("active");$("tabT").classList.remove("active")};
renderPresets();renderDex();restore();
</script></body></html>
